[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rogery77-parrotline"
version = "0.1.0"
description = "逐条比对原文与复述，找出遗漏的约束、弱化的语气与新增的不存在的限制"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rogery77" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rogery77.github.io"
Repository = "https://github.com/rogery77/parrotline"
Issues = "https://github.com/rogery77/parrotline/issues"

[project.scripts]
parrotline = "parrotline:main"

[tool.setuptools]
py-modules = ["parrotline"]
